name: Real browser smoke
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Choose isolated browser runtime
        run: echo "CAMOFOX_MCP_HOME=$RUNNER_TEMP/camofox-smoke" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install supported Ubuntu browser libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0t64 libasound2t64 libnss3 libx11-xcb1 libxt6 libdbus-glib-1-2
      - name: Install the pinned upstream runtime and browser
        run: node src/cli.mjs setup
      - name: Run real browser contracts
        run: xvfb-run -a npm run test:live
